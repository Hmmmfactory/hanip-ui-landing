<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>B01호 편집장 연결</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;color:#263238;background:#eef0ed}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}.card{width:min(100%,520px);background:#f7f7f3;border:1px solid rgba(38,50,56,.25);padding:32px;box-sizing:border-box}h1{font-size:1.7rem;margin:0 0 12px}h2{font-size:1.15rem;margin:0 0 8px}p{line-height:1.7;color:#54646a;font-size:.93rem}label{display:block;font-size:.84rem;font-weight:600;margin:24px 0 8px}input{width:100%;box-sizing:border-box;border:1px solid #8a979b;background:#fff;padding:13px;font:inherit}button{margin-top:16px;width:100%;border:0;background:#263238;color:#fff;padding:14px;font:inherit;font-weight:700;cursor:pointer}button.secondary{background:#59686d}button:disabled{opacity:.6;cursor:wait}.status{min-height:1.4em;margin:16px 0 0;font-size:.88rem;white-space:pre-wrap}.status.ok{color:#176b43}.status.error{color:#a52b22}.note{font-size:.76rem;margin-top:22px}.test-panel{border-top:1px solid rgba(38,50,56,.2);margin-top:30px;padding-top:28px}.warning{background:#fff4d8;border-left:3px solid #c88a14;padding:12px;margin:14px 0}.status a{color:inherit;font-weight:700}
  </style>
</head>
<body>
  <main class="card">
    <h1>B01호 편집장 연결</h1>
    <p>Telegram 봇의 웹훅을 연결합니다. Vercel에 등록한 <code>CRON_SECRET</code>을 입력하고 한 번만 실행하세요.</p>
    <form id="setup-form">
      <label for="secret">CRON_SECRET</label>
      <input id="secret" type="password" autocomplete="off" required>
      <button id="submit" type="submit">Telegram 연결하기</button>
    </form>
    <p id="status" class="status" aria-live="polite"></p>
    <section class="test-panel" aria-labelledby="test-title">
      <h2 id="test-title">발행 없는 연결 테스트</h2>
      <p class="warning"><code>EDITORIAL_APPROVAL_ENABLED=false</code>와 <code>EDITORIAL_AUTOPUBLISH=false</code>로 시작하세요. 생성되는 테스트 PR은 설정과 관계없이 병합되지 않습니다.</p>
      <form id="test-form">
        <label for="test-secret">CRON_SECRET</label>
        <input id="test-secret" type="password" autocomplete="off" required>
        <label for="test-topic">테스트 글감 — 선택</label>
        <input id="test-topic" type="text" maxlength="160" placeholder="예: 좁은 방 수납 위치는 어떻게 정하나요?">
        <button id="test-submit" type="submit">테스트 초안 보내기</button>
        <button id="test-check" class="secondary" type="button" disabled>마지막 테스트 상태 확인</button>
      </form>
      <p id="test-status" class="status" aria-live="polite"></p>
    </section>
    <p class="note">CRON_SECRET은 연결·테스트 요청에만 사용되며 브라우저 저장소나 서버 로그에 저장하지 않습니다.</p>
  </main>
  <script>
    document.getElementById('setup-form').addEventListener('submit', async function(event) {
      event.preventDefault();
      const secret = document.getElementById('secret').value;
      const button = document.getElementById('submit');
      const status = document.getElementById('status');
      button.disabled = true; status.className = 'status'; status.textContent = '연결 중...';
      try {
        const response = await fetch('/api/telegram/setup', { method: 'POST', headers: { Authorization: 'Bearer ' + secret } });
        const result = await response.json();
        if (!response.ok || !result.ok) throw new Error(result.error || '연결에 실패했습니다.');
        document.getElementById('secret').value = '';
        status.className = 'status ok'; status.textContent = '연결되었습니다. 이제 Telegram에서 봇에게 /start를 보내세요.';
      } catch (error) {
        status.className = 'status error'; status.textContent = error.message;
      } finally { button.disabled = false; }
    });

    let lastTestPr = null;
    const testStatus = document.getElementById('test-status');
    const testButton = document.getElementById('test-submit');
    const checkButton = document.getElementById('test-check');

    function showTestResult(result) {
      const lines = [
        '테스트 PR #' + result.number,
        '병합되지 않음: ' + (result.testNotMerged ? '확인' : '주의'),
        'main 기준 SHA 유지: ' + (result.mainStillAtBase ? '확인' : '변경됨'),
        result.score == null ? null : '점수: ' + result.score + '/100',
        result.held == null ? null : '보류: ' + (result.held ? '확인' : '아니요'),
        result.preview ? 'Preview: ' + result.preview : 'Preview: 배포 확인 중'
      ].filter(Boolean);
      testStatus.className = result.testNotMerged ? 'status ok' : 'status error';
      testStatus.textContent = lines.join('\n') + '\n';
      const link = document.createElement('a');
      link.href = result.pr; link.target = '_blank'; link.rel = 'noopener'; link.textContent = 'GitHub PR 열기 ↗';
      testStatus.appendChild(link);
    }

    document.getElementById('test-form').addEventListener('submit', async function(event) {
      event.preventDefault();
      const secretInput = document.getElementById('test-secret');
      const secret = secretInput.value;
      const topic = document.getElementById('test-topic').value.trim();
      testButton.disabled = true; checkButton.disabled = true; testStatus.className = 'status'; testStatus.textContent = '테스트 PR 생성 중...';
      try {
        const response = await fetch('/api/editorial/test', { method: 'POST', headers: { Authorization: 'Bearer ' + secret, 'Content-Type': 'application/json' }, body: JSON.stringify({ topic: topic || undefined }) });
        const result = await response.json();
        if (!response.ok || !result.ok) throw new Error(result.error || '테스트 초안 생성에 실패했습니다.');
        lastTestPr = result.number; showTestResult(result); checkButton.disabled = false;
      } catch (error) { testStatus.className = 'status error'; testStatus.textContent = error.message; }
      finally { testButton.disabled = false; }
    });

    checkButton.addEventListener('click', async function() {
      const secret = document.getElementById('test-secret').value;
      if (!secret || !lastTestPr) { testStatus.className = 'status error'; testStatus.textContent = 'CRON_SECRET과 마지막 테스트 PR이 필요합니다.'; return; }
      checkButton.disabled = true; testStatus.className = 'status'; testStatus.textContent = '테스트 상태 확인 중...';
      try {
        const response = await fetch('/api/editorial/test?number=' + encodeURIComponent(lastTestPr), { headers: { Authorization: 'Bearer ' + secret } });
        const result = await response.json();
        if (!response.ok || !result.ok) throw new Error(result.error || '테스트 상태 확인에 실패했습니다.');
        showTestResult(result);
      } catch (error) { testStatus.className = 'status error'; testStatus.textContent = error.message; }
      finally { checkButton.disabled = false; }
    });
  </script>
</body>
</html>
