<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>B01호 편집장 연결</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;color:#263238;background:#eef0ed}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}.card{width:min(100%,460px);background:#f7f7f3;border:1px solid rgba(38,50,56,.25);padding:32px;box-sizing:border-box}h1{font-size:1.7rem;margin:0 0 12px}p{line-height:1.7;color:#54646a;font-size:.93rem}label{display:block;font-size:.84rem;font-weight:600;margin:24px 0 8px}input{width:100%;box-sizing:border-box;border:1px solid #8a979b;background:#fff;padding:13px;font:inherit}button{margin-top:16px;width:100%;border:0;background:#263238;color:#fff;padding:14px;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.status{min-height:1.4em;margin:16px 0 0;font-size:.88rem;white-space:pre-wrap}.status.ok{color:#176b43}.status.error{color:#a52b22}.note{font-size:.76rem;margin-top:22px}
  </style>
</head>
<body>
  <main class="card">
    <h1>B01호 편집장 연결</h1>
    <p>Telegram 봇의 웹훅을 연결합니다. Vercel에 등록한 <code>CRON_SECRET</code>을 입력하고 한 번만 실행하세요.</p>
    <form id="setup-form">
      <label for="secret">CRON_SECRET</label>
      <input id="secret" type="password" autocomplete="off" required>
      <button id="submit" type="submit">Telegram 연결하기</button>
    </form>
    <p id="status" class="status" aria-live="polite"></p>
    <p class="note">입력값은 이 페이지에 저장되지 않으며, Telegram 연결 요청에만 사용됩니다.</p>
  </main>
  <script>
    document.getElementById('setup-form').addEventListener('submit', async function(event) {
      event.preventDefault();
      const secret = document.getElementById('secret').value;
      const button = document.getElementById('submit');
      const status = document.getElementById('status');
      button.disabled = true; status.className = 'status'; status.textContent = '연결 중...';
      try {
        const response = await fetch('/api/telegram/setup', { method: 'POST', headers: { Authorization: 'Bearer ' + secret } });
        const result = await response.json();
        if (!response.ok || !result.ok) throw new Error(result.error || '연결에 실패했습니다.');
        document.getElementById('secret').value = '';
        status.className = 'status ok'; status.textContent = '연결되었습니다. 이제 Telegram에서 봇에게 /start를 보내세요.';
      } catch (error) {
        status.className = 'status error'; status.textContent = error.message;
      } finally { button.disabled = false; }
    });
  </script>
</body>
</html>
